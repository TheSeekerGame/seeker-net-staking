# The timer: starts a round of the credits bot every 5 minutes. GitHub's own
# schedule hasn't fired on this repository, so this small workflow waits 5
# minutes, starts the next timer, then starts a round. It runs apart from the
# rounds, so waiting never holds up a round or a site update.
#
# Only one timer ever runs: a new one waits for the running one to finish (and
# replaces any other waiting one). The schedule below is a fallback that
# restarts the chain if it ever breaks, once GitHub's schedule works here.
# To start it (once): Actions > timer > Run workflow. To stop it: disable the workflow.
name: timer
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  actions: write
concurrency:
  group: timer
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 5 minutes, start the next timer, start a round
        run: |
          sleep 300
          # each with a few tries, and the next timer first, so one failed call never stops the chain
          for i in 1 2 3 4 5; do gh workflow run timer.yml --repo "$GITHUB_REPOSITORY" --ref main && break; sleep 15; done
          for i in 1 2 3; do gh workflow run credits.yml --repo "$GITHUB_REPOSITORY" --ref main && break; sleep 15; done
        env:
          GH_TOKEN: ${{ github.token }}
